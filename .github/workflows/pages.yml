name: Deploy GameHub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Verify static export
        run: |
          test -f out/pong-duel/index.html
          test -f out/hoop-duel/index.html
          test -f out/football-random/index.html
          test -f out/mini-football/index.html
          test -f out/volley-duel/index.html
          test -f out/tennis-duel/index.html
          test -f out/air-hockey/index.html
          test -f out/racing-duel/index.html
          test -f out/manifest.webmanifest
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/favicon.svg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
